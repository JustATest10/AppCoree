<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apprendre le Coréen</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            padding: 20px;
            text-align: center;
            background: rgba(255,255,255,0.05);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        header h1 {
            font-size: clamp(1.4rem, 4vw, 2rem);
            background: linear-gradient(90deg, #e94560, #f5a623);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .mode-selector {
            display: flex;
            gap: 10px;
            padding: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .mode-btn {
            padding: 12px 20px;
            border: 2px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05);
            color: #fff;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
            text-align: center;
        }

        .mode-btn:hover {
            background: rgba(233,69,96,0.3);
            border-color: #e94560;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #e94560, #c23152);
            border-color: #e94560;
            box-shadow: 0 0 20px rgba(233,69,96,0.4);
        }

        .main-card {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 600px;
            margin: 10px auto;
            backdrop-filter: blur(10px);
        }

        .word-display {
            text-align: center;
            margin-bottom: 25px;
        }

        .korean-word {
            font-size: clamp(2.5rem, 10vw, 4rem);
            color: #f5a623;
            margin-bottom: 8px;
            letter-spacing: 4px;
        }

        .translation {
            font-size: 1.1rem;
            color: #a8d8ea;
            margin-bottom: 6px;
        }

        .romanization-hint {
            font-size: 0.95rem;
            color: #ccc;
        }

        .audio-btn {
            background: linear-gradient(135deg, #4a90e2, #357abd);
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0 auto 20px;
            transition: all 0.3s;
        }

        .audio-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(74,144,226,0.5);
        }

        .audio-btn-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 0 auto 20px;
        }

        .audio-btn-row .audio-btn {
            margin: 0;
        }

        .audio-btn-slow {
            background: linear-gradient(135deg, #7a5fd0, #5b3fae);
            padding: 12px 20px;
            font-size: 0.9rem;
        }

        .audio-btn-slow:hover {
            box-shadow: 0 5px 20px rgba(122,95,208,0.5);
        }

        .input-area {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .answer-input {
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 1.1rem;
            width: 100%;
            text-align: center;
            transition: border-color 0.3s;
        }

        .answer-input:focus {
            outline: none;
            border-color: #e94560;
        }

        .answer-input[readonly] {
            background: rgba(255,255,255,0.1);
            cursor: default;
        }

        .answer-input.correct {
            border-color: #2ecc71;
            background: rgba(46,204,113,0.1);
        }

        .answer-input.wrong {
            border-color: #e74c3c;
            background: rgba(231,76,60,0.1);
        }

        .submit-btn {
            background: linear-gradient(135deg, #e94560, #c23152);
            border: none;
            color: white;
            padding: 14px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.3s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(233,69,96,0.5);
        }

        .skip-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.25);
            color: #ccc;
            padding: 10px 14px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.85rem;
            width: 100%;
            margin-top: 10px;
            transition: all 0.3s;
        }

        .skip-btn:hover {
            background: rgba(231,76,60,0.15);
            border-color: #e74c3c;
            color: #ff8a80;
        }

        .feedback {
            margin-top: 15px;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            font-size: 1rem;
            display: none;
        }

        .feedback.correct {
            background: rgba(46,204,113,0.2);
            border: 1px solid #2ecc71;
            color: #2ecc71;
            display: block;
        }

        .feedback.wrong {
            background: rgba(231,76,60,0.15);
            border: 1px solid #e74c3c;
            color: #ff8a80;
            display: block;
        }

        .feedback-icon {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .continue-btn {
            background: linear-gradient(135deg, #27ae60, #1e8449);
            border: none;
            color: white;
            padding: 14px 30px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            margin-top: 12px;
            width: 100%;
            transition: all 0.3s;
            display: none;
        }

        .continue-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(39,174,96,0.5);
        }

        /* CLAVIER CORÉEN */
        .keyboard-container {
            margin-top: 15px;
            background: rgba(0,0,0,0.3);
            border-radius: 16px;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .keyboard-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
        }

        .kb-tab {
            padding: 6px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05);
            color: #ccc;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .kb-tab.active {
            background: #e94560;
            border-color: #e94560;
            color: white;
        }

        .keyboard-row {
            display: flex;
            gap: 5px;
            margin-bottom: 5px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .key {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 10px 8px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            min-width: 38px;
            text-align: center;
            transition: all 0.15s;
            user-select: none;
        }

        .key:hover {
            background: rgba(233,69,96,0.4);
            border-color: #e94560;
        }

        .key:active {
            transform: scale(0.92);
        }

        .key.special {
            font-size: 0.75rem;
            padding: 10px 10px;
            min-width: 50px;
            background: rgba(255,255,255,0.05);
        }

        .key.space-key {
            min-width: 120px;
        }

        .kb-hint {
            margin-top: 10px;
            font-size: 0.78rem;
            color: #999;
            text-align: center;
            line-height: 1.5;
        }

        .kb-hint strong {
            color: #a8d8ea;
        }

        .audio-notice {
            display: none;
            margin-top: 10px;
            padding: 10px 14px;
            font-size: 0.82rem;
            color: #ffcc80;
            background: rgba(245,166,35,0.12);
            border: 1px solid rgba(245,166,35,0.35);
            border-radius: 10px;
            line-height: 1.5;
        }

        .mic-row {
            display: flex;
            justify-content: center;
            margin: 10px auto 6px;
        }

        .mic-btn {
            background: linear-gradient(135deg, #e94560, #c23152);
            border: none;
            color: white;
            padding: 14px 30px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: bold;
            transition: all 0.3s;
        }

        .mic-btn:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(233,69,96,0.5);
        }

        .mic-btn:disabled {
            opacity: 0.75;
            cursor: default;
        }

        .mic-status {
            min-height: 1.2em;
            margin-top: 8px;
            padding: 0 10px;
            font-size: 0.85rem;
            color: #ffcc80;
            text-align: center;
            line-height: 1.5;
        }

        /* STATS */
        .stats-bar {
            display: flex;
            gap: 15px;
            padding: 10px 20px;
            background: rgba(255,255,255,0.04);
            border-radius: 12px;
            margin: 0 auto 10px;
            width: 90%;
            max-width: 600px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .stat-item {
            text-align: center;
            font-size: 0.85rem;
            color: #aaa;
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: #f5a623;
        }

        .progress-bar {
            width: 90%;
            max-width: 600px;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            margin: 0 auto 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #e94560, #f5a623);
            border-radius: 3px;
            transition: width 0.4s ease;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .main-card {
                padding: 20px 15px;
            }
            .key {
                min-width: 32px;
                padding: 8px 5px;
                font-size: 1rem;
            }
            .key.special {
                min-width: 42px;
                font-size: 0.7rem;
            }
        }

        .mode-description {
            text-align: center;
            color: #aaa;
            font-size: 0.9rem;
            margin-bottom: 20px;
            padding: 10px;
            background: rgba(255,255,255,0.04);
            border-radius: 10px;
        }

        .hangul-display-input {
            font-size: 1.5rem;
            letter-spacing: 3px;
            min-height: 54px;
        }

        .cursor-blink {
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

<header>
    <h1>🇰🇷 Apprendre le Coréen</h1>
</header>

<div class="mode-selector">
    <button class="mode-btn" onclick="setMode(0)">
        Mode 0<br><small>Voyelle/Consonne</small>
    </button>
    <button class="mode-btn active" onclick="setMode(1)">
        Mode 1<br><small>한글 → Son</small>
    </button>
    <button class="mode-btn" onclick="setMode(2)">
        Mode 2<br><small>Son → 한글</small>
    </button>
    <button class="mode-btn" onclick="setMode(3)">
        Mode 3<br><small>🔊 Audio → 한글</small>
    </button>
    <button class="mode-btn" onclick="setMode(4)">
        Mode 4<br><small>🎤 Prononciation</small>
    </button>
</div>

<div class="stats-bar">
    <div class="stat-item">
        <div class="stat-value" id="score-correct">0</div>
        <div>✅ Correct</div>
    </div>
    <div class="stat-item">
        <div class="stat-value" id="score-wrong">0</div>
        <div>❌ Erreurs</div>
    </div>
    <div class="stat-item">
        <div class="stat-value" id="score-total">0</div>
        <div>Total</div>
    </div>
    <div class="stat-item">
        <div class="stat-value" id="score-pct">0%</div>
        <div>Réussite</div>
    </div>
</div>

<div class="progress-bar">
    <div class="progress-fill" id="progress-fill" style="width:0%"></div>
</div>

<div class="main-card" id="main-card">
    <div class="mode-description" id="mode-desc">Lisez le mot coréen et écrivez sa romanisation (sons)</div>
    
    <div class="word-display" id="word-display">
        <!-- contenu dynamique -->
    </div>

    <div class="input-area" id="input-area">
        <input type="text" class="answer-input" id="answer-input" placeholder="Votre réponse..." autocomplete="off" autocorrect="off" spellcheck="false"/>
        <button class="submit-btn" id="submit-btn" onclick="checkAnswer()">Vérifier ✓</button>
    </div>
    <button class="skip-btn" id="skip-btn" onclick="giveUp()">🔄 Changer de mot (je ne sais pas)</button>

    <div class="feedback" id="feedback"></div>
    <button class="continue-btn" id="continue-btn" onclick="nextWord()">Continuer →</button>

    <div class="keyboard-container" id="keyboard-container" style="display:none;">
        <div class="keyboard-tabs">
            <button class="kb-tab active" onclick="switchKbTab('initial')">Initiales</button>
            <button class="kb-tab" onclick="switchKbTab('vowel')">Voyelles</button>
            <button class="kb-tab" onclick="switchKbTab('final')">Finales</button>
        </div>
        <div id="keyboard-keys"></div>
        <div class="kb-hint">⌨️ Astuce : vous pouvez aussi taper directement avec votre clavier (disposition coréenne 2-beolsik), ex : <strong>r</strong>=ㄱ, <strong>s</strong>=ㄴ, <strong>k</strong>=ㅏ, <strong>h</strong>=ㅗ</div>
    </div>
</div>

// ============================================================
// MOTEUR DE COMPOSITION HANGUL (comme un vrai clavier coréen)
// ============================================================
const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const JUNG = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
const JONG = ['', 'ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const INVALID_JONG_SIMPLE = ['ㄸ','ㅃ','ㅉ']; // consonnes tendues qui n'existent pas en finale

const VOWEL_COMBOS = {'ㅗㅏ':'ㅘ','ㅗㅐ':'ㅙ','ㅗㅣ':'ㅚ','ㅜㅓ':'ㅝ','ㅜㅔ':'ㅞ','ㅜㅣ':'ㅟ','ㅡㅣ':'ㅢ'};
const VOWEL_DECOMPOSE = {'ㅘ':'ㅗ','ㅙ':'ㅗ','ㅚ':'ㅗ','ㅝ':'ㅜ','ㅞ':'ㅜ','ㅟ':'ㅜ','ㅢ':'ㅡ'};
const JONG_COMBOS = {'ㄱㅅ':'ㄳ','ㄴㅈ':'ㄵ','ㄴㅎ':'ㄶ','ㄹㄱ':'ㄺ','ㄹㅁ':'ㄻ','ㄹㅂ':'ㄼ','ㄹㅅ':'ㄽ','ㄹㅌ':'ㄾ','ㄹㅍ':'ㄿ','ㄹㅎ':'ㅀ','ㅂㅅ':'ㅄ'};
const JONG_DECOMPOSE = {'ㄳ':['ㄱ','ㅅ'],'ㄵ':['ㄴ','ㅈ'],'ㄶ':['ㄴ','ㅎ'],'ㄺ':['ㄹ','ㄱ'],'ㄻ':['ㄹ','ㅁ'],'ㄼ':['ㄹ','ㅂ'],'ㄽ':['ㄹ','ㅅ'],'ㄾ':['ㄹ','ㅌ'],'ㄿ':['ㄹ','ㅍ'],'ㅀ':['ㄹ','ㅎ'],'ㅄ':['ㅂ','ㅅ']};

// État du bloc syllabique en cours de composition (le dernier caractère "ouvert" du champ)
let compState = { cho: null, jung: null, jong: null };

// Mapping clavier physique QWERTY -> disposition coréenne standard (2-beolsik)
const QWERTY_TO_HANGUL = {
    'q':'ㅂ','Q':'ㅃ','w':'ㅈ','W':'ㅉ','e':'ㄷ','E':'ㄸ','r':'ㄱ','R':'ㄲ','t':'ㅅ','T':'ㅆ',
    'y':'ㅛ','u':'ㅕ','i':'ㅑ','o':'ㅐ','O':'ㅒ','p':'ㅔ','P':'ㅖ',
    'a':'ㅁ','s':'ㄴ','d':'ㅇ','f':'ㄹ','g':'ㅎ','h':'ㅗ','j':'ㅓ','k':'ㅏ','l':'ㅣ',
    'z':'ㅋ','x':'ㅌ','c':'ㅊ','v':'ㅍ','b':'ㅠ','n':'ㅜ','m':'ㅡ'
};

function composeSyllable(choChar, jungChar, jongChar) {
    const choIdx = CHO.indexOf(choChar);
    const jungIdx = JUNG.indexOf(jungChar);
    const jongIdx = jongChar ? JONG.indexOf(jongChar) : 0;
    if (choIdx === -1 || jungIdx === -1 || jongIdx === -1) return choChar || '';
    const code = 0xAC00 + (choIdx * 21 + jungIdx) * 28 + jongIdx;
    return String.fromCharCode(code);
}

function isValidJong(ch) {
    if (INVALID_JONG_SIMPLE.includes(ch)) return false;
    return JONG.includes(ch) && ch !== '';
}

function resetComp() {
    compState = { cho: null, jung: null, jong: null };
}

function commitCurrentBlock() {
    resetComp();
}

function renderBlock(state) {
    if (state.cho !== null && state.jung !== null) {
        return composeSyllable(state.cho, state.jung, state.jong || '');
    } else if (state.cho !== null) {
        return state.cho;
    }
    return '';
}

function rerenderLastBlock() {
    const input = document.getElementById('answer-input');
    input.value = input.value.slice(0, -1) + renderBlock(compState);
}

function appendChar(ch) {
    document.getElementById('answer-input').value += ch;
}

function handleConsonant(ch) {
    const canBeCho = CHO.includes(ch);
    const canBeJong = isValidJong(ch);

    // Aucun bloc ouvert
    if (compState.cho === null && compState.jung === null) {
        if (canBeCho) {
            compState = { cho: ch, jung: null, jong: null };
        }
        appendChar(ch);
        return;
    }

    // Consonne initiale seule en attente d'une voyelle
    if (compState.cho !== null && compState.jung === null) {
        commitCurrentBlock();
        if (canBeCho) compState = { cho: ch, jung: null, jong: null };
        appendChar(ch);
        return;
    }

    // Bloc complet (initiale + voyelle) sans finale
    if (compState.jong === null) {
        if (canBeJong) {
            compState.jong = ch;
            rerenderLastBlock();
        } else {
            commitCurrentBlock();
            if (canBeCho) compState = { cho: ch, jung: null, jong: null };
            appendChar(ch);
        }
        return;
    }

    // Une finale existe déjà : tenter une finale composée (ex: ㄱ+ㅅ=ㄳ)
    const combo = JONG_COMBOS[compState.jong + ch];
    if (combo) {
        compState.jong = combo;
        rerenderLastBlock();
    } else {
        commitCurrentBlock();
        if (canBeCho) compState = { cho: ch, jung: null, jong: null };
        appendChar(ch);
    }
}

function handleVowel(ch) {
    // Aucun bloc ouvert : la voyelle démarre avec une initiale muette (ㅇ)
    if (compState.cho === null && compState.jung === null) {
        compState = { cho: 'ㅇ', jung: ch, jong: null };
        appendChar(composeSyllable('ㅇ', ch));
        return;
    }

    // Initiale seule en attente : combine initiale + voyelle
    if (compState.cho !== null && compState.jung === null) {
        compState.jung = ch;
        rerenderLastBlock();
        return;
    }

    // Une voyelle existe déjà sans finale : tenter une diphtongue (ex: ㅗ+ㅏ=ㅘ)
    if (compState.jong === null) {
        const combo = VOWEL_COMBOS[compState.jung + ch];
        if (combo) {
            compState.jung = combo;
            rerenderLastBlock();
        } else {
            commitCurrentBlock();
            compState = { cho: 'ㅇ', jung: ch, jong: null };
            appendChar(composeSyllable('ㅇ', ch));
        }
        return;
    }

    // Une finale existe : elle doit "glisser" pour devenir l'initiale du bloc suivant
    const decomp = JONG_DECOMPOSE[compState.jong];
    let remainingJong = null, newCho;
    if (decomp) {
        remainingJong = decomp[0];
        newCho = decomp[1];
    } else {
        remainingJong = null;
        newCho = compState.jong;
    }
    compState.jong = remainingJong;
    rerenderLastBlock();
    commitCurrentBlock();
    compState = { cho: newCho, jung: ch, jong: null };
    appendChar(composeSyllable(newCho, ch));
}

function autoSwitchTab() {
    let target = currentKbTab;
    if (compState.cho !== null && compState.jung === null) {
        target = 'vowel';
    } else if (compState.cho !== null && compState.jung !== null) {
        target = 'initial';
    }
    if (target !== currentKbTab) {
        switchKbTab(target);
    }
}

function setMode(mode) {
    // Sauvegarde l'état d'entrée en cours du mode qu'on quitte (si pas encore répondu)
    saveCurrentInputState();

    currentMode = mode;
    document.querySelectorAll('.mode-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i === mode);
    });

    const state = modeState[mode];
    if (!state.word) {
        state.word = pickWordForMode(mode);
    }
    currentWord = state.word;

    if (state.answered) {
        restoreAnsweredUI(mode);
    } else {
        setupUIForCurrentWord();
    }
}

// ============================================================
// CHOIX D'UN MOT POUR UN MODE DONNÉ
// (évite, autant que possible, de reprendre un mot déjà affiché
// dans un autre mode, pour que les 3 modes montrent des mots différents)
// ============================================================
function pickWordForMode(mode) {
    if (mode === 0) {
        if (jamoUsedIndices.length >= jamoList.length) {
            jamoUsedIndices = [];
        }
        let jIdx;
        do {
            jIdx = Math.floor(Math.random() * jamoList.length);
        } while (jamoUsedIndices.includes(jIdx));
        jamoUsedIndices.push(jIdx);
        return jamoList[jIdx];
    }

    if (usedIndices.length >= words.length) {
        usedIndices = [];
    }

    const otherWordKeys = new Set(
        Object.keys(modeState)
            .filter(m => Number(m) !== mode && Number(m) !== 0)
            .map(m => modeState[m].word)
            .filter(Boolean)
            .map(w => w.k)
    );

    let idx, attempts = 0;
    do {
        idx = Math.floor(Math.random() * words.length);
        attempts++;
    } while (
        attempts < 50 &&
        (usedIndices.includes(idx) || otherWordKeys.has(words[idx].k))
    );

    usedIndices.push(idx);
    return words[idx];
}

    updateProgress();
    setupUIForCurrentWord();
}

// ============================================================
// RESTAURATION DE L'INTERFACE POUR UN MOT DÉJÀ RÉPONDU
// (quand on revient sur un mode déjà terminé)
// ============================================================
function restoreAnsweredUI(mode) {
    const state = modeState[mode];
    answered = true;
    stopRecognition();
    stopAllSpeech();

    const input = document.getElementById('answer-input');
    input.value = '';
    resetComp();
    input.className = 'answer-input' + ((mode === 0 || mode === 2 || mode === 3) ? ' hangul-display-input' : '');
    if (state.correct) input.classList.add('correct');
    else input.classList.add('wrong');
    input.disabled = true;
    applyMobileInputMode(input);

    document.getElementById('input-area').style.display = (mode === 4) ? 'none' : 'flex';

    const feedback = document.getElementById('feedback');
    feedback.className = 'feedback ' + (state.correct ? 'correct' : 'wrong');
    feedback.innerHTML = state.feedbackHTML;

    document.getElementById('continue-btn').style.display = 'block';
    document.getElementById('submit-btn').style.display = 'none';
    document.getElementById('skip-btn').style.display = 'none';

    renderWordDisplay();

    if (mode !== 0 && mode !== 2 && mode !== 3) {
        document.getElementById('keyboard-container').style.display = 'none';
    } else {
        document.getElementById('keyboard-container').style.display = 'block';
        renderKeyboard();
    }
}

    }
    input.disabled = false;
    applyMobileInputMode(input);

    document.getElementById('input-area').style.display = (currentMode === 4) ? 'none' : 'flex';

    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback').innerHTML = '';
    document.getElementById('continue-btn').style.display = 'none';
    document.getElementById('submit-btn').style.display = 'block';
    document.getElementById('skip-btn').style.display = 'block';

    renderWordDisplay();

    if (currentMode !== 0 && currentMode !== 2 && currentMode !== 3) {
        document.getElementById('keyboard-container').style.display = 'none';
        if (currentMode !== 4) input.focus();
    } else {
        document.getElementById('keyboard-container').style.display = 'block';
        renderKeyboard();
    }

    if (currentMode === 3) {
        setTimeout(() => speakWord(), 300);
    }
}

// ============================================================
// EMPÊCHE LE CLAVIER NATIF DU TÉLÉPHONE DE S'OUVRIR
// (en modes 2/3, la saisie se fait via le clavier coréen virtuel
// à l'écran ou le clavier physique QWERTY en 2-beolsik : on rend le
// champ "readonly" pour qu'il reste focusable/affichable sans faire
// apparaître le clavier tactile du téléphone)
// ============================================================
function applyMobileInputMode(input) {
    if (currentMode === 0 || currentMode === 2 || currentMode === 3) {
        input.setAttribute('readonly', 'readonly');
        input.setAttribute('inputmode', 'none');
    } else {
        input.removeAttribute('readonly');
        input.removeAttribute('inputmode');
    }
}

// ============================================================
// AFFICHAGE DU MOT
// ============================================================
function renderWordDisplay() {
    const wd = document.getElementById('word-display');
    const desc = document.getElementById('mode-desc');
    const input = document.getElementById('answer-input');

    if (currentMode === 0) {
        desc.textContent = "Lisez le son et écrivez le jamo (voyelle ou consonne) correspondant";
        input.placeholder = "ex: ㅏ, ㄱ...";
        wd.innerHTML = `
            <div class="korean-word" style="font-size:2.8rem; color:#a8d8ea;">${currentWord.r}</div>
            <div class="translation">Tapez la voyelle ou consonne coréenne (jamo) qui correspond à ce son</div>
        `;
    } else if (currentMode === 1) {
        desc.textContent = "Lisez le mot coréen et écrivez sa romanisation (sons)";
        input.placeholder = "ex: gomo, appa...";
        wd.innerHTML = `
            <div class="korean-word">${currentWord.k}</div>
            <div class="translation">🇫🇷 ${currentWord.f}</div>
        `;
    } else if (currentMode === 2) {
        desc.textContent = "Lisez la romanisation et écrivez le mot en hangeul";
        input.placeholder = "Tapez en hangeul...";
        wd.innerHTML = `
            <div class="korean-word" style="font-size:2rem; color:#a8d8ea;">${currentWord.r}</div>
            <div class="translation">🇫🇷 ${currentWord.f}</div>
        `;
    } else if (currentMode === 3) {
        desc.textContent = "Écoutez l'audio et écrivez le mot en hangeul";
        input.placeholder = "Tapez en hangeul...";
        wd.innerHTML = `
            <div class="audio-btn-row">
                <button class="audio-btn" onclick="speakWord(1)">🔊 Écouter</button>
                <button class="audio-btn audio-btn-slow" onclick="speakWord(0.5)">🐢 Écouter lentement</button>
            </div>
            <div class="translation">🇫🇷 ${currentWord.f}</div>
            <div class="audio-notice" id="audio-notice"></div>
        `;
    } else if (currentMode === 4) {
        desc.textContent = "Lisez le mot à voix haute, le micro vérifie votre prononciation";
        wd.innerHTML = `
            <div class="korean-word">${currentWord.k}</div>
            <div class="translation">🇫🇷 ${currentWord.f} <small style="opacity:0.7;">(${currentWord.r})</small></div>
            <div class="mic-row">
                <button class="mic-btn" id="mic-btn" onclick="startPronunciationCheck()">🎤 Parler</button>
            </div>
            <div class="mic-status" id="mic-status"></div>
        `;
    }
}

// ============================================================
// SYNTHÈSE VOCALE
// ============================================================
function speakWord(rate) {
    // rate: 1 = vitesse normale, 0.5 = vitesse lente (pour une compréhension plus facile)
    rate = rate || 1;
    stopAllSpeech();
    const myId = speechRequestId;
    const useNative = synth && synth.getVoices().length && koreanVoice;

    if (useNative) {
        speakWithBrowserVoice(rate, myId);
    } else {
        speakWithOnlineFallback(rate, myId);
    }
}

// Empêche deux voix de se chevaucher : coupe la synthèse native ET l'audio
// en ligne en cours, et invalide (via speechRequestId) les callbacks
// asynchrones d'une éventuelle lecture précédente encore en attente.
function stopAllSpeech() {
    speechRequestId++;
    if (synth) {
        try { synth.cancel(); } catch (e) {}
    }
    if (currentOnlineAudio) {
        try { currentOnlineAudio.pause(); currentOnlineAudio.currentTime = 0; } catch (e) {}
        currentOnlineAudio = null;
    }
}

function speakWithBrowserVoice(rate, myId) {
    rate = rate || 1;
    showAudioNotice('');
    // Certains navigateurs (notamment Brave) peuvent ignorer silencieusement un
    // speak() appelé juste après cancel() : un petit délai évite ce souci.
    setTimeout(() => {
        if (myId !== speechRequestId) return; // une nouvelle demande a été faite entre-temps

        const utt = new SpeechSynthesisUtterance(currentWord.k);
        utt.lang = 'ko-KR';
        utt.rate = rate;
        if (koreanVoice) utt.voice = koreanVoice;

        let started = false;
        utt.onstart = () => { started = true; };
        utt.onerror = (e) => {
            if (myId !== speechRequestId) return;
            console.warn('Erreur de synthèse vocale locale, bascule en ligne :', e.error);
            speakWithOnlineFallback(rate, myId);
        };
        synth.speak(utt);

        // Filet de sécurité : sur Brave, speak() reste parfois bloqué en pause.
        setTimeout(() => {
            if (myId !== speechRequestId) return;
            if (synth.paused) synth.resume();
        }, 100);

        // Si la lecture native n'a jamais démarré après un court délai (bug
        // connu de Brave où la synthèse vocale s'arrête de répondre), on
        // bascule sur la voix en ligne. On vérifie "started" (et pas juste
        // synth.speaking) pour éviter de déclencher les deux voix en même
        // temps si la voix native démarre juste après ce délai.
        setTimeout(() => {
            if (myId !== speechRequestId) return;
            if (!started && !synth.speaking && !synth.pending) {
                speakWithOnlineFallback(rate, myId);
            }
        }, 700);
    }, 60);
}

// Voix de secours en ligne : utilisée quand aucune voix coréenne n'est
// installée localement (fréquent sur Brave/Chrome sans pack de langue coréen).
// Nécessite une connexion internet.
function speakWithOnlineFallback(rate, myId) {
    rate = rate || 1;
    if (myId !== speechRequestId) return;

    // Coupe toute synthèse native qui aurait pu démarrer entre-temps, pour
    // ne jamais entendre les deux voix (homme/femme) en même temps.
    if (synth) {
        try { synth.cancel(); } catch (e) {}
    }

    showAudioNotice('🌐 Utilisation de la voix coréenne en ligne (aucune voix locale détectée)...');
    const url = 'https://translate.google.com/translate_tts?ie=UTF-8&tl=ko&client=tw-ob&q=' + encodeURIComponent(currentWord.k);
    const audio = new Audio(url);
    currentOnlineAudio = audio;
    audio.playbackRate = rate;
    audio.onplay = () => { if (myId === speechRequestId) showAudioNotice(''); };
    audio.onerror = () => {
        if (myId !== speechRequestId) return;
        showAudioNotice("⚠️ Lecture audio impossible : aucune voix coréenne locale et pas d'accès à la voix en ligne (vérifiez votre connexion internet).");
    };
    audio.play().catch(() => {
        if (myId !== speechRequestId) return;
        showAudioNotice("⚠️ Lecture audio impossible : aucune voix coréenne locale et pas d'accès à la voix en ligne (vérifiez votre connexion internet).");
    });
}

function showAudioNotice(msg) {
    const el = document.getElementById('audio-notice');
    if (!el) return;
    el.textContent = msg;
    el.style.display = msg ? 'block' : 'none';
}

// ============================================================
// MODE 4 : VÉRIFICATION DE LA PRONONCIATION (reconnaissance vocale)
// ============================================================
let recognition = null;

function getSpeechRecognitionClass() {
    return window.SpeechRecognition || window.webkitSpeechRecognition || null;
}

function stopRecognition() {
    if (recognition) {
        try { recognition.onresult = null; recognition.onerror = null; recognition.onend = null; recognition.abort(); } catch (e) {}
        recognition = null;
    }
}

function setMicStatus(msg) {
    const el = document.getElementById('mic-status');
    if (el) el.textContent = msg;
}

function startPronunciationCheck() {
    if (answered || currentMode !== 4) return;

    const SR = getSpeechRecognitionClass();
    const micBtn = document.getElementById('mic-btn');

    if (!SR) {
        setMicStatus("⚠️ La reconnaissance vocale n'est pas disponible sur ce navigateur. Essayez avec Chrome (ordinateur ou Android).");
        return;
    }

    stopRecognition();
    recognition = new SR();
    recognition.lang = 'ko-KR';
    recognition.maxAlternatives = 5;
    recognition.interimResults = false;

    micBtn.disabled = true;
    micBtn.textContent = '🎙️ Je vous écoute...';
    setMicStatus('');

    recognition.onresult = function (e) {
        const results = e.results[0];
        const alternatives = [];
        for (let i = 0; i < results.length; i++) alternatives.push(results[i].transcript);
        evaluatePronunciation(alternatives);
    };

    recognition.onerror = function (e) {
        micBtn.disabled = false;
        micBtn.textContent = '🎤 Parler';
        if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
            if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
                setMicStatus("⚠️ Accès au micro refusé. Le micro nécessite une page servie en HTTPS (ou localhost) : ouvrir directement le fichier (file://) ne suffit pas. Sinon, vérifiez l'autorisation du micro pour ce site.");
            } else {
                setMicStatus("⚠️ Accès au micro refusé. Autorisez le micro pour ce site puis réessayez.");
            }
        } else if (e.error === 'no-speech') {
            setMicStatus("🤔 Aucun son détecté, réessayez.");
        } else {
            setMicStatus("⚠️ Erreur de reconnaissance vocale (" + e.error + "). Réessayez.");
        }
    };

    recognition.onend = function () {
        micBtn.disabled = false;
        micBtn.textContent = '🎤 Parler';
    };

    try {
        recognition.start();
    } catch (err) {
        if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
            setMicStatus("⚠️ Impossible de démarrer le micro : cette page doit être servie en HTTPS (ou localhost) pour que le micro fonctionne.");
        } else {
            setMicStatus("⚠️ Impossible de démarrer le micro. Réessayez.");
        }
        micBtn.disabled = false;
        micBtn.textContent = '🎤 Parler';
    }
}

function normalizeKoreanSpeech(str) {
    return str.replace(/[\s.,!?~？！。、'"]/g, '').toLowerCase();
}

function evaluatePronunciation(alternatives) {
    if (answered || currentMode !== 4) return;
    answered = true;
    stats.total++;

    stopRecognition();
    document.getElementById('skip-btn').style.display = 'none';

    const target = normalizeKoreanSpeech(currentWord.k);
    const heard = alternatives[0] || '';
    const isCorrect = alternatives.some(a => normalizeKoreanSpeech(a) === target);

    const feedback = document.getElementById('feedback');

    if (isCorrect) {
        stats.correct++;
        feedback.className = 'feedback correct';
        feedback.innerHTML = `
            <div class="feedback-icon">✅</div>
            <strong>Excellent !</strong> Bonne prononciation !<br>
            <small>Reconnu : "${heard}"</small>
        `;
    } else {
        stats.wrong++;
        feedback.className = 'feedback wrong';
        feedback.innerHTML = `
            <div class="feedback-icon">❌</div>
            <strong>Pas tout à fait !</strong><br>
            Mot attendu : <strong>${currentWord.k}</strong> (${currentWord.r})<br>
            <small>Ce qui a été compris : "${heard || '(rien de compréhensible)'}"</small><br>
            <small>💡 Réécoutez-vous et réessayez avec le prochain mot. La reconnaissance vocale peut aussi se tromper, ne vous inquiétez pas si vous êtes sûr(e) de votre prononciation.</small>
        `;
    }

    setMicStatus('');
    document.getElementById('continue-btn').style.display = 'block';
    updateStats();
}

// ============================================================
// VÉRIFICATION DE LA RÉPONSE
// ============================================================
function checkAnswer() {
    if (answered) return;
    const input = document.getElementById('answer-input');
    const userAnswer = input.value.trim().toLowerCase();
    if (!userAnswer) return;

    answered = true;
    stats.total++;
    input.disabled = true;

    const feedback = document.getElementById('feedback');
    const continueBtn = document.getElementById('continue-btn');
    const submitBtn = document.getElementById('submit-btn');
    submitBtn.style.display = 'none';
    document.getElementById('skip-btn').style.display = 'none';

    let isCorrect = false;

    if (currentMode === 1) {
        // Romanisation : accepter plusieurs variantes
        const accepted = getAcceptedRomanizations(currentWord.r);
        isCorrect = accepted.some(v => normalize(userAnswer) === normalize(v));
    } else {
        // Hangeul exact
        isCorrect = userAnswer === currentWord.k;
    }

    if (isCorrect) {
        stats.correct++;
        input.classList.add('correct');
        feedback.className = 'feedback correct';
        feedback.innerHTML = `
            <div class="feedback-icon">✅</div>
            <strong>Excellent !</strong> Bonne réponse !
        `;
    } else {
        stats.wrong++;
        input.classList.add('wrong');
        feedback.className = 'feedback wrong';

        let explanation = '';
        if (currentMode === 0) {
            explanation = `Le bon jamo est : <strong>${currentWord.k}</strong> (son "${currentWord.r}")<br>
            <small>${currentWord.f}</small><br>
            <small>Votre réponse : "${userAnswer}"</small>`;
        } else if (currentMode === 1) {
            explanation = `La bonne romanisation est : <strong>${currentWord.r}</strong><br>
            <small>Votre réponse : "${userAnswer}"</small><br>
            <small>💡 ${getRomanizationExplanation(currentWord)}</small>`;
        } else {
            explanation = `Le bon hangeul est : <strong>${currentWord.k}</strong> (${currentWord.r})<br>
            <small>Votre réponse : "${userAnswer}"</small>`;
        }

        feedback.innerHTML = `
            <div class="feedback-icon">❌</div>
            <strong>Pas tout à fait !</strong><br>${explanation}
        `;
    }

    continueBtn.style.display = 'block';
    updateStats();
}

// ============================================================
// CHANGER DE MOT (abandon = compte comme une erreur)
// ============================================================
function giveUp() {
    if (answered) return;
    answered = true;
    stats.total++;
    stats.wrong++;

    stopRecognition();
    const input = document.getElementById('answer-input');
    input.disabled = true;
    document.getElementById('submit-btn').style.display = 'none';
    document.getElementById('skip-btn').style.display = 'none';
    if (currentMode === 4) setMicStatus('');

    const feedback = document.getElementById('feedback');
    feedback.className = 'feedback wrong';

    let explanation = '';
    if (currentMode === 0) {
        explanation = `Le bon jamo est : <strong>${currentWord.k}</strong> (son "${currentWord.r}")`;
    } else if (currentMode === 1) {
        explanation = `La bonne romanisation est : <strong>${currentWord.r}</strong><br>
        <small>💡 ${getRomanizationExplanation(currentWord)}</small>`;
    } else if (currentMode === 4) {
        explanation = `Le mot à prononcer était : <strong>${currentWord.k}</strong> (${currentWord.r})`;
    } else {
        explanation = `Le bon hangeul est : <strong>${currentWord.k}</strong> (${currentWord.r})`;
    }

    feedback.innerHTML = `
        <div class="feedback-icon">🚩</div>
        <strong>Mot passé.</strong><br>
        <small>${currentMode === 0 ? currentWord.f : 'Traduction : ' + currentWord.f}</small><br>
        ${explanation}
    `;

    document.getElementById('continue-btn').style.display = 'block';
    updateStats();
}

function normalize(str) {
    return str.toLowerCase().replace(/[\s\-]/g, '');
}

function getAcceptedRomanizations(r) {
    const variants = [r];
    // Variantes courantes g/k, d/t, b/p, j/ch, r/l
    const swaps = [
        ['g','k'],['k','g'],
        ['d','t'],['t','d'],
        ['b','p'],['p','b'],
        ['j','ch'],['ch','j'],
        ['r','l'],['l','r'],
        ['eo','o'],['o','eo'],
        ['eu','u'],['u','eu'],
        ['ae','e'],['e','ae'],
    ];
    swaps.forEach(([a, b]) => {
        if (r.includes(a)) variants.push(r.replace(new RegExp(a, 'g'), b));
    });
    return [...new Set(variants)];
}

function getRomanizationExplanation(word) {
    const explanations = {
        'eo': "eo = son entre 'o' et 'e' en coréen (ㅓ)",
        'eu': "eu = son neutre, comme un 'u' non arrondi (ㅡ)",
        'ae': "ae = son proche de 'e' ouvert (ㅐ)",
        'oe': "oe = voyelle composée (ㅚ)",
        'ui': "ui = voyelle composée (ㅢ)",
        'ng': "ng = son nasal final (ㅇ en position finale)",
    };
    for (const [pattern, exp] of Object.entries(explanations)) {
        if (word.r.includes(pattern)) return exp;
    }
    return "Attention à la prononciation des consonnes et voyelles coréennes.";
}

// ============================================================
// STATISTIQUES
// ============================================================
function updateStats() {
    document.getElementById('score-correct').textContent = stats.correct;
    document.getElementById('score-wrong').textContent = stats.wrong;
    document.getElementById('score-total').textContent = stats.total;
    const pct = stats.total > 0 ? Math.round((stats.correct / stats.total) * 100) : 0;
    document.getElementById('score-pct').textContent = pct + '%';
}

function updateProgress() {
    const pct = currentMode === 0
        ? (jamoUsedIndices.length / jamoList.length) * 100
        : (usedIndices.length / words.length) * 100;
    document.getElementById('progress-fill').style.width = pct + '%';
}

// ============================================================
// CLAVIER CORÉEN VIRTUEL
// ============================================================
function switchKbTab(tab) {
    currentKbTab = tab;
    document.querySelectorAll('.kb-tab').forEach((t, i) => {
        t.classList.toggle('active', ['initial','vowel','final'][i] === tab);
    });
    renderKeyboard();
}

function renderKeyboard() {
    const container = document.getElementById('keyboard-keys');
    const data = keyboard[currentKbTab];
    let html = '';

    data.keys.forEach(row => {
        html += '<div class="keyboard-row">';
        row.forEach(key => {
            html += `<button class="key" onclick="typeHangul('${key}')">${key}</button>`;
        });
        html += '</div>';
    });

    html += `<div class="keyboard-row">
        <button class="key special" onclick="deleteHangul()">⌫ Suppr</button>
        <button class="key space-key" onclick="typeHangul(' ')">Espace</button>
        <button class="key special" onclick="clearInput()">✕ Effacer</button>
    </div>`;

    container.innerHTML = html;
}

function typeHangul(char) {
    const input = document.getElementById('answer-input');
    if (input.disabled) return;

    // Mode 0 : on veut le jamo brut (ex: ㅏ), pas une syllabe composée (ex: 아)
    if (currentMode === 0) {
        if (char === ' ') return;
        input.value = char;
        input.focus();
        return;
    }

    if (char === ' ') {
        commitCurrentBlock();
        input.value += ' ';
        input.focus();
        return;
    }

    if (JUNG.includes(char)) {
        handleVowel(char);
    } else {
        handleConsonant(char);
    }

    autoSwitchTab();
    input.focus();
}

function deleteHangul() {
    const input = document.getElementById('answer-input');
    if (input.disabled) return;
    if (input.value.length === 0) return;

    if (currentMode === 0) {
        input.value = '';
        return;
    }

    if (compState.jong !== null) {
        const decomp = JONG_DECOMPOSE[compState.jong];
        compState.jong = decomp ? decomp[0] : null;
        rerenderLastBlock();
    } else if (compState.jung !== null) {
        const revert = VOWEL_DECOMPOSE[compState.jung];
        if (revert) {
            compState.jung = revert;
        } else {
            compState.jung = null;
        }
        rerenderLastBlock();
    } else if (compState.cho !== null) {
        resetComp();
        input.value = input.value.slice(0, -1);
    } else {
        input.value = input.value.slice(0, -1);
    }
}

function clearInput() {
    const input = document.getElementById('answer-input');
    if (input.disabled) return;
    input.value = '';
    resetComp();
}

// ============================================================
// ÉVÉNEMENTS CLAVIER
// ============================================================
document.getElementById('answer-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
        if (!answered) {
            checkAnswer();
        } else {
            nextWord();
        }
        return;
    }

    // Clavier physique en disposition coréenne (2-beolsik) pour les modes hangeul
    if ((currentMode === 0 || currentMode === 2 || currentMode === 3) && !answered) {
        if (e.isComposing || e.metaKey || e.ctrlKey || e.altKey) return;

        if (e.key === 'Backspace') {
            e.preventDefault();
            deleteHangul();
            return;
        }
        if (currentMode === 0 && e.key === ' ') {
            e.preventDefault();
            return;
        }
        if (e.key === ' ') {
            e.preventDefault();
            typeHangul(' ');
            return;
        }
        if (e.key.length === 1) {
            e.preventDefault();
            const mapped = QWERTY_TO_HANGUL[e.key];
            if (mapped) typeHangul(mapped);
        }
    }
});

// ============================================================
// INITIALISATION
// ============================================================
nextWord();
